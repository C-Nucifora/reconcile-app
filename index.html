<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reconcile</title>
    <script>
      // No-FOUC: set the theme class before first paint. Must never throw and
      // must agree with src/theme (same key + resolve logic). Falls back to light.
      (function () {
        try {
          var choice = localStorage.getItem("reconcile.theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark =
            choice === "dark" ||
            ((choice === "system" || choice === null) && prefersDark);
          var root = document.documentElement;
          if (dark) {
            root.classList.add("dark");
          } else {
            root.classList.remove("dark");
          }
        } catch (e) {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
